name: Release Reconcile (Sandbox)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    if: vars.ENABLE_RELEASE_GATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - run: node sandbox/reconcile-demo.mjs
